name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      full_matrix:
        description: "Run every E2E spec on all 5 browser projects"
        type: boolean
        default: false

concurrency:
  # One run per ref; a new push to a PR cancels the outdated run.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, build & unit tests
    # Pinned: Playwright 1.57 has no browser builds for ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test

  playwright-version:
    name: Resolve Playwright version
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      version: ${{ steps.pw.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false
      - id: pw
        # Read the locked version so the container image always matches the
        # installed @playwright/test (a mismatch fails with missing browsers).
        run: echo "version=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)" >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E (${{ matrix.scope }} ${{ matrix.shard }}/2)
    needs: playwright-version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Official image: browsers + system deps preinstalled (no apt, no cache).
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        # PRs: Chromium runs everything, other engines only @cross-browser specs.
        # main / manual full run: every spec on every project.
        scope: ${{ (github.event_name == 'push' || inputs.full_matrix) && fromJSON('["full"]') || fromJSON('["targeted"]') }}
        shard: [1, 2]
    env:
      E2E_FULL: ${{ matrix.scope == 'full' && '1' || '' }}
      # Firefox refuses to run as root under a different $HOME owner.
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      # Service worker offline proof against a production build (one Chromium
      # spec, ~10 s incl. build). Here rather than in `checks` because this
      # container already ships the browsers; once per run (shard 1), and
      # even if the main suite failed so both signals are reported.
      - name: Offline (service worker)
        if: matrix.shard == 1 && !cancelled()
        run: npm run test:offline
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.scope }}-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
