<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- iOS ignores SVG touch icons: PNG rendered by scripts/generate-icons.mjs. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Zoom stays available (WCAG 1.4.4); taps on the board never zoom
         because the canvas and the game container set touch-action. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0c0e" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Shape Stack" />
    <meta
      name="description"
      content="Shape Stack — a minimalist rhythm game. Tap at the right moment to stack shapes inside each other."
    />
    <title>Shape Stack</title>
    <!-- Link previews (chats, feeds). Crawlers need absolute URLs: these name
         the public build (GAME_URL in src/modes/share.ts). The image comes
         from scripts/generate-og-image.mjs. -->
    <link rel="canonical" href="https://thenkei.github.io/jokarikara/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shape Stack" />
    <meta property="og:title" content="Shape Stack" />
    <meta
      property="og:description"
      content="A minimalist rhythm game. Tap at the right moment to stack shapes inside each other."
    />
    <meta property="og:url" content="https://thenkei.github.io/jokarikara/" />
    <meta property="og:image" content="https://thenkei.github.io/jokarikara/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Shape Stack: a circle, hexagon, square and triangle stacked inside each other."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
